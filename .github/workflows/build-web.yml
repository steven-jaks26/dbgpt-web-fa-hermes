name: Build Web Application

# Triggered manually (Actions tab) or on pushes/PRs touching the UI source.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Add swap space (build OOMs on 7G host)
        run: |
          sudo swapon --show || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify Next.js installation
        run: |
          npm ls next --depth=0
          ls -la node_modules/next/dist/bin/next
          node node_modules/next/dist/bin/next --version

      - name: Build web application
        run: |
          {
            echo "### Build output"
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          NODE_OPTIONS=--max_old_space_size=4096 node node_modules/next/dist/bin/next build > /tmp/next-build.log 2>&1
          BUILD_RC=$?
          echo "next build exit: $BUILD_RC"
          tail -100 /tmp/next-build.log
          tail -100 /tmp/next-build.log >> "$GITHUB_STEP_SUMMARY"
          if [ $BUILD_RC -ne 0 ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $BUILD_RC
          fi
          node node_modules/next/dist/bin/next export > /tmp/next-export.log 2>&1
          EXPORT_RC=$?
          echo "next export exit: $EXPORT_RC"
          cat /tmp/next-export.log
          cat /tmp/next-export.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $EXPORT_RC

      - name: Upload build logs (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            /tmp/next-build.log
            /tmp/next-export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack static UI
        run: |
          cd out
          zip -r ../dbgpt-web-ui.zip .

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbgpt-web-ui-${{ github.sha }}
          path: dbgpt-web-ui.zip
          if-no-files-found: error
          retention-days: 7
